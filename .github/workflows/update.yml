name: Otomatik IPTV Güncelleyici

on:
  schedule:
    # Her gün saat 04:00 UTC (TSİ 07:00) otomatik çalışır
    - cron: '0 4 * * *'
  workflow_dispatch: # Manuel tek tıkla çalıştırma butonu
  push:
    branches:
      - main
    paths:
      - 'generate_playlist.py'

concurrency:
  group: update-playlist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install requests

      - name: Listeyi Doğrula ve Oluştur
        run: |
          python generate_playlist.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar.m3u kanallar.m3u8
          if git diff --staged --quiet; then
            echo "Değişiklik yok, liste güncel."
          else
            git commit -m "chore: Canlı kanallar güncellendi [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
